; boris.gb 2026-10-25 13:58 - телефония go24 (GO24DEV-501): план набора. Сотрудник набирает внутренний номер — звонят
; его SIP-телефон и софтфон go24 сразу (учётка «w<номер>» — софтфон в браузере); никто не зарегистрирован — «занято».
; boris.gb 2026-10-25 17:03 - детализация и запись звонков (GO24DEV-503): по окончании каждого звонка Asterisk сообщает
; go24 (go24-cdr: номера, начало, ответ, конец, итог, файл записи); запись (MixMonitor в том telephony-records), если её
; включил администратор — go24 ставит учёткам GO24_RECORD=1. Адрес go24 и ключ — в go24-globals.conf (пишет start.sh).
; boris.gb 2026-10-25 17:54 - внешние линии (GO24DEV-505): номер длиннее внутреннего (или с «+») уходит наружу через
; go24-out; входящие с линий — go24-in-<линия>. Эти контексты пишет go24 в go24/extensions.conf (Настройки → Телефония
; → Внешние линии): какую линию берёт сотрудник и кого звонок с линии будит — всех сразу или по очереди.
; boris.gb 2026-10-25 19:48 - рабочее время линии и неотвеченный звонок (GO24DEV-538): go24-voicemail — голосовая почта
; (приветствие линии, сигнал, сообщение клиента до 2 минут — в том записей, go24 узнаёт о нём по vm=1), go24-forward —
; переадресация звонка с линии на внешний номер через ту же линию. Звуки (сигнал, приветствия) пишет go24 в go24/.
[general]
static = yes
writeprotect = yes

[globals]
#include go24-globals.conf

[go24-phones]
exten => _X.,1,NoOp(go24: ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(GO24_FROM=${CALLERID(num)})
 same => n,Set(GO24_TO=${EXTEN})
 same => n,Set(CHANNEL(hangup_handler_push)=go24-cdr,s,1)
 same => n,GotoIf($[${LEN(${EXTEN})} > 8]?out)
 same => n,Set(DEV=${PJSIP_DIAL_CONTACTS(${EXTEN})})
 same => n,Set(WEB=${PJSIP_DIAL_CONTACTS(w${EXTEN})})
 same => n,GotoIf($["${DEV}${WEB}" = ""]?nope)
 same => n,Gosub(go24-record,s,1)
 same => n,Dial(${DEV}${IF($["${DEV}" != "" & "${WEB}" != ""]?&)}${WEB},45)
 same => n,Hangup()
 same => n(nope),Busy(5)
 same => n,Hangup()
 same => n(out),Goto(go24-out,${EXTEN},1)
exten => _+X.,1,NoOp(go24: ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(GO24_FROM=${CALLERID(num)})
 same => n,Set(GO24_TO=${EXTEN})
 same => n,Set(CHANNEL(hangup_handler_push)=go24-cdr,s,1)
 same => n,Goto(go24-out,${EXTEN},1)

; запись разговора, если она включена
[go24-record]
exten => s,1,ExecIf($["${GO24_RECORD}" = "1" & "${GO24_REC}" = ""]?Set(GO24_REC=${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${UNIQUEID}.wav))
 same => n,ExecIf($["${GO24_REC}" != ""]?MixMonitor(go24/${GO24_REC}))
 same => n,Return()

; звонок сотруднику с внешней линии (Local/<номер>@go24-ring): его SIP-телефон и софтфон
[go24-ring]
exten => _X.,1,Set(DEV=${PJSIP_DIAL_CONTACTS(${EXTEN})})
 same => n,Set(WEB=${PJSIP_DIAL_CONTACTS(w${EXTEN})})
 same => n,GotoIf($["${DEV}${WEB}" = ""]?nope)
 same => n,Dial(${DEV}${IF($["${DEV}" != "" & "${WEB}" != ""]?&)}${WEB},60)
 same => n(nope),Hangup()

; входящий с внешней линии: ARG1 — номер линии, ARG2 — первый, кого будит звонок, ARG3 — линия
[go24-in]
exten => s,1,NoOp(go24: ${CALLERID(num)} -> line ${ARG1})
 same => n,Set(GO24_FROM=${CALLERID(num)})
 same => n,Set(GO24_TO=${ARG1})
 same => n,Set(GO24_BY=${ARG2})
 same => n,Set(GO24_LINE=${ARG1})
 same => n,Set(CHANNEL(hangup_handler_push)=go24-cdr,s,1)
 same => n,Gosub(go24-record,s,1)
 same => n,Return()

; звонок наружу: ARG1 — линия, ARG2 — её номер (его видит тот, кому звонят), ARG3 — номер
[go24-dial-out]
exten => s,1,Set(GO24_LINE=${ARG2})
 same => n,Set(CALLERID(num)=${ARG2})
 same => n,Gosub(go24-record,s,1)
 same => n,Dial(PJSIP/${ARG3}@${ARG1},60)
 same => n,Hangup()

; голосовая почта: ARG1 — приветствие линии (файл без расширения; "" — нет), затем сигнал и сообщение клиента — до 2 минут,
; конец — 5 с тишины или «#» (q: свой сигнал Record не играет — его звука в образе нет). Запись разговора (если шла) останавливается: в тот же файл пишется сообщение
[go24-voicemail]
exten => s,1,StopMixMonitor()
 same => n,Set(GO24_REC=${IF($["${GO24_REC}" = ""]?${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${UNIQUEID}.wav:${GO24_REC})})
 same => n,Set(GO24_VM=1)
 same => n,Answer()
 same => n,Wait(1)
 same => n,ExecIf($["${ARG1}" != ""]?Playback(${ARG1}))
 same => n,Playback(/etc/asterisk/go24/beep)
 same => n,Record(/var/spool/asterisk/monitor/go24/${GO24_REC},5,120,kq)
 same => n,Return()

; переадресация звонка с линии наружу: ARG1 — линия, ARG2 — её номер (провайдеры пропускают только свой), ARG3 — номер;
; номер клиента — в имени звонящего
[go24-forward]
exten => s,1,Set(CALLERID(name)=${GO24_FROM})
 same => n,Set(CALLERID(num)=${ARG2})
 same => n,Dial(PJSIP/${ARG3}@${ARG1},60)
 same => n,Return()

; сотруднику нельзя звонить наружу или внешних линий нет
[go24-no-line]
exten => s,1,Congestion(5)
 same => n,Hangup()

[go24-cdr]
exten => s,1,Set(CURLOPT(conntimeout)=3)
 same => n,Set(CURLOPT(httptimeout)=5)
 same => n,Set(GO24_PEER=${IF($["${GO24_LINE}" != "" & "${DIALEDPEERNUMBER}" != ""]?${CUT(DIALEDPEERNUMBER,@,1)}:${GO24_BY})})
 same => n,Set(GO24_OK=${CURL(${GO24_CDR},key=${URIENCODE(${GO24_KEY})}&id=${URIENCODE(${UNIQUEID})}&from=${URIENCODE(${GO24_FROM})}&to=${URIENCODE(${GO24_TO})}&by=${URIENCODE(${GO24_PEER})}&line=${URIENCODE(${GO24_LINE})}&start=${CDR(start,u)}&answer=${CDR(answer,u)}&end=${EPOCH}&dial=${DIALSTATUS}&rec=${URIENCODE(${GO24_REC})}&vm=${GO24_VM})})
 same => n,Return()

#tryinclude go24/extensions.conf
