; boris.gb 2026-10-25 13:58 - телефония go24 (GO24DEV-501): план набора. Сотрудник набирает внутренний номер — звонят
; его SIP-телефон и софтфон go24 сразу (учётка «w<номер>» — софтфон в браузере); никто не зарегистрирован — «занято».
; boris.gb 2026-10-25 17:03 - детализация и запись звонков (GO24DEV-503): по окончании каждого звонка Asterisk сообщает
; go24 (go24-cdr: номера, начало, ответ, конец, итог, файл записи); запись (MixMonitor в том telephony-records), если её
; включил администратор — go24 ставит учёткам GO24_RECORD=1. Адрес go24 и ключ — в go24-globals.conf (пишет start.sh).
; boris.gb 2026-10-25 17:54 - внешние линии (GO24DEV-505): номер длиннее внутреннего (или с «+») уходит наружу через
; go24-out; входящие с линий — go24-in-<линия>. Эти контексты пишет go24 в go24/extensions.conf (Настройки → Телефония
; → Внешние линии): какую линию берёт сотрудник и кого звонок с линии будит — всех сразу или по очереди.
; boris.gb 2026-10-25 19:48 - рабочее время линии и неотвеченный звонок (GO24DEV-538): go24-voicemail — голосовая почта
; (приветствие линии, сигнал, сообщение клиента до 2 минут — в том записей, go24 узнаёт о нём по vm=1), go24-forward —
; переадресация звонка с линии на внешний номер через ту же линию. Звуки (сигнал, приветствия) пишет go24 в go24/.
; boris.gb 2026-10-26 11:48 - перевод звонка (GO24DEV-632): софтфон и SIP-телефон переводят собеседника (REFER) — учётки go24 ставят
; TRANSFER_CONTEXT=go24-transfer: внутренний номер звонит сотруднику, внешний уходит через линию звонка (GO24_TRUNK, у
; исходящего — наследуется каналом клиента); кто перевёл и кому — в детализацию (xfrom, xto). Перевод с консультацией
; (Replaces) Asterisk соединяет сам, план набора не участвует.
; boris.gb 2026-10-26 13:10 - обратный звонок (GO24DEV-653): go24 по запросу с сайта звонит сотрудникам формы
; (go24-cb-<форма> в go24/extensions.conf); go24-cb-who делает ответившего сотрудника звонящим другой половины, которая
; набирает клиента через линию; go24-cb-end — время ответа клиента (а не сотрудника) для детализации (GO24_ANSWER).
; boris.gb 2026-10-26 13:51 - оценка разговора (GO24DEV-666): у линии с «Просить клиента оценить разговор» Dial идёт с g —
; сотрудник положил трубку, клиент остаётся, go24-rate проигрывает приглашение линии и читает цифру 1–5 (GO24_RATE),
; go24-cdr отдаёт её go24 (rate=).
; boris.gb 2026-10-26 14:08 - группы очереди (GO24DEV-671): go24-q-<группа> (go24/extensions.conf) ставит звонок в
; очередь; ответивший (go24-q-who) сообщается каналу клиента через SHARED(GO24_QBY), время ответа — SHARED(GO24_QANS);
; go24-cdr берёт их (ответил, кто и когда).
; boris.gb 2026-10-26 15:46 - звонок ответственному (GO24DEV-683): у линии с «Звонок клиента из CRM — сначала ответственному»
; go24-owner спрашивает go24 (адрес детализации с owner вместо cdr), чей клиент звонит, и звонит его ответственному; не
; ответил — линия идёт дальше как обычно. Номер для чёрного списка — GO24_BNUM: GO24_KEY канала перекрывал ключ go24.
; boris.gb 2026-10-26 17:29 - права доступа телефонии (GO24DEV-695): сотрудника с запретом исходящих go24 не ставит в go24-out
; (go24-no-line — «занято»), с правом «только клиентам CRM» — через go24-out-crm: спрашивает go24 (адрес детализации с
; outok вместо cdr), есть ли номер в CRM, и только тогда набирает через линию.
; boris.gb 2026-10-26 20:49 - звонок из REST (GO24DEV-714): POST /api/v1/telephony/call — go24 звонит сотруднику
; (Local/<внутренний>*<номер>@go24-click, на телефоне — номер клиента); ответил — другая половина (звонящий — его
; внутренний номер) идёт в go24-phones и набирает номер, как будто его набрал сам сотрудник: линии и права — те же.
[general]
static = yes
writeprotect = yes

[globals]
#include go24-globals.conf

[go24-phones]
exten => _X.,1,NoOp(go24: ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(GO24_FROM=${CALLERID(num)})
 same => n,Set(GO24_TO=${EXTEN})
 same => n,Set(CHANNEL(hangup_handler_push)=go24-cdr,s,1)
 same => n,GotoIf($[${LEN(${EXTEN})} > 8]?out)
 same => n,Set(DEV=${PJSIP_DIAL_CONTACTS(${EXTEN})})
 same => n,Set(WEB=${PJSIP_DIAL_CONTACTS(w${EXTEN})})
 same => n,GotoIf($["${DEV}${WEB}" = ""]?nope)
 same => n,Gosub(go24-record,s,1)
 same => n,Dial(${DEV}${IF($["${DEV}" != "" & "${WEB}" != ""]?&)}${WEB},45)
 same => n,Hangup()
 same => n(nope),Busy(5)
 same => n,Hangup()
 same => n(out),Goto(go24-out,${EXTEN},1)
exten => _+X.,1,NoOp(go24: ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(GO24_FROM=${CALLERID(num)})
 same => n,Set(GO24_TO=${EXTEN})
 same => n,Set(CHANNEL(hangup_handler_push)=go24-cdr,s,1)
 same => n,Goto(go24-out,${EXTEN},1)

; запись разговора, если она включена
[go24-record]
exten => s,1,ExecIf($["${GO24_RECORD}" = "1" & "${GO24_REC}" = ""]?Set(GO24_REC=${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${UNIQUEID}.wav))
 same => n,ExecIf($["${GO24_REC}" != ""]?MixMonitor(go24/${GO24_REC}))
 same => n,Return()

; звонок сотруднику с внешней линии (Local/<номер>@go24-ring): его SIP-телефон и софтфон
[go24-ring]
exten => _X.,1,Set(DEV=${PJSIP_DIAL_CONTACTS(${EXTEN})})
 same => n,Set(WEB=${PJSIP_DIAL_CONTACTS(w${EXTEN})})
 same => n,GotoIf($["${DEV}${WEB}" = ""]?nope)
 same => n,Dial(${DEV}${IF($["${DEV}" != "" & "${WEB}" != ""]?&)}${WEB},60)
 same => n(nope),Hangup()

; входящий с внешней линии: ARG1 — номер линии, ARG2 — первый, кого будит звонок, ARG3 — линия
[go24-in]
exten => s,1,NoOp(go24: ${CALLERID(num)} -> line ${ARG1})
 same => n,Set(GO24_FROM=${CALLERID(num)})
 same => n,Set(GO24_TO=${ARG1})
 same => n,Set(GO24_BY=${ARG2})
 same => n,Set(GO24_LINE=${ARG1})
 same => n,Set(GO24_TRUNK=${ARG3})
 same => n,Set(GO24_TNUM=${ARG1})
 same => n,Set(CHANNEL(hangup_handler_push)=go24-cdr,s,1)
 same => n,Gosub(go24-record,s,1)
 same => n,Return()

; звонок наружу: ARG1 — линия, ARG2 — её номер (его видит тот, кому звонят), ARG3 — номер
[go24-dial-out]
exten => s,1,Set(GO24_LINE=${ARG2})
 same => n,Set(__GO24_TRUNK=${ARG1})
 same => n,Set(__GO24_TNUM=${ARG2})
 same => n,Set(CALLERID(num)=${ARG2})
 same => n,Gosub(go24-record,s,1)
 same => n,Dial(PJSIP/${ARG3}@${ARG1},60)
 same => n,Hangup()

; голосовая почта: ARG1 — приветствие линии (файл без расширения; "" — нет), затем сигнал и сообщение клиента — до 2 минут,
; конец — 5 с тишины или «#» (q: свой сигнал Record не играет — его звука в образе нет). Запись разговора (если шла) останавливается: в тот же файл пишется сообщение
[go24-voicemail]
exten => s,1,StopMixMonitor()
 same => n,Set(GO24_REC=${IF($["${GO24_REC}" = ""]?${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${UNIQUEID}.wav:${GO24_REC})})
 same => n,Set(GO24_VM=1)
 same => n,Answer()
 same => n,Wait(1)
 same => n,ExecIf($["${ARG1}" != ""]?Playback(${ARG1}))
 same => n,Playback(/etc/asterisk/go24/beep)
 same => n,Record(/var/spool/asterisk/monitor/go24/${GO24_REC},5,120,kq)
 same => n,Return()

; переадресация звонка с линии наружу: ARG1 — линия, ARG2 — её номер (провайдеры пропускают только свой), ARG3 — номер;
; номер клиента — в имени звонящего
[go24-forward]
exten => s,1,Set(CALLERID(name)=${GO24_FROM})
 same => n,Set(CALLERID(num)=${ARG2})
 same => n,Dial(PJSIP/${ARG3}@${ARG1},60)
 same => n,Return()

; перевод звонка (REFER): EXTEN — куда; BLINDTRANSFER — канал того, кто перевёл (PJSIP/w101-…). У канала без своей
; детализации (собеседник исходящего или внутреннего звонка) она начинается здесь: клиент → кому перевели
[go24-transfer]
exten => _X.,1,Gosub(go24-xfer,s,1(${EXTEN}))
 same => n,Hangup()
exten => _+X.,1,Gosub(go24-xfer,s,1(${EXTEN}))
 same => n,Hangup()

[go24-xfer]
exten => s,1,NoOp(go24: transfer by ${BLINDTRANSFER} -> ${ARG1})
 same => n,Set(GO24_XFROM=${CUT(CUT(BLINDTRANSFER,/,2),-,1)})
 same => n,Set(GO24_XFROM=${IF($["${GO24_XFROM:0:1}" = "w"]?${GO24_XFROM:1}:${GO24_XFROM})})
 same => n,Set(GO24_XTO=${ARG1})
 same => n,GotoIf($["${GO24_FROM}" != ""]?go)
 same => n,Set(GO24_FROM=${CALLERID(num)})
 same => n,Set(GO24_TO=${ARG1})
 same => n,Set(GO24_LINE=${GO24_TNUM})
 same => n,Set(CHANNEL(hangup_handler_push)=go24-cdr,s,1)
 same => n(go),GotoIf($[${LEN(${ARG1})} > 8 | "${ARG1:0:1}" = "+"]?out)
 same => n,Set(GO24_BY=${ARG1})
 same => n,Dial(Local/${ARG1}@go24-ring,45)
 same => n,Return()
 same => n(out),GotoIf($["${GO24_TRUNK}" = ""]?nope)
 same => n,Gosub(go24-forward,s,1(${GO24_TRUNK},${GO24_TNUM},${ARG1}))
 same => n,Return()
 same => n(nope),Congestion(5)
 same => n,Return()

; исходящий сотрудника, которому можно звонить только клиентам CRM: ARG1 — линия, ARG2 — её номер, ARG3 — набранный
[go24-out-crm]
exten => s,1,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(httptimeout)=3)
 same => n,Set(GO24_OK=${CURL(${GO24_CDR:0:-3}outok,key=${URIENCODE(${GO24_KEY})}&to=${URIENCODE(${ARG3})})})
 same => n,GotoIf($["${GO24_OK}" = "1"]?ok)
 same => n,Gosub(go24-no-line,s,1)
 same => n,Return()
 same => n(ok),Gosub(go24-dial-out,s,1(${ARG1},${ARG2},${ARG3}))
 same => n,Return()

; сотруднику нельзя звонить наружу или внешних линий нет
[go24-no-line]
exten => s,1,Congestion(5)
 same => n,Hangup()

; оценка разговора: ARG1 — приглашение линии ("" — линия не спрашивает); клиент нажимает 1–5 за 6 с
[go24-rate]
exten => s,1,GotoIf($["${ARG1}" = "" | "${DIALSTATUS}" != "ANSWER"]?end)
 same => n,Read(GO24_RATE,${ARG1},1,,1,6)
 same => n(end),Return()

; обратный звонок: ARG1 — другая половина звонка (Local …;1); ответивший сотрудник — её звонящий (SHARED: та половина
; читает ${SHARED(GO24_FROM)} — общие переменные отдельны от обычных)
[go24-cb-who]
exten => s,1,Set(SHARED(GO24_FROM,${ARG1})=${CUT(CUT(CHANNEL(name),@,1),/,2)})
 same => n,Return()

; обратный звонок окончен: клиент ответил ANSWEREDTIME секунд назад (0 — не ответил)
[go24-cb-end]
exten => s,1,Set(GO24_ANSWER=${IF($[0${ANSWEREDTIME} > 0]?$[${EPOCH} - ${ANSWEREDTIME}]:0)})
 same => n,Return()

; группа очереди: ответивший сотрудник и время ответа — каналу клиента (GO24_QCALLER: Queue не передаёт аргументы
; подпрограмме, канал клиента наследуется участником)
[go24-q-who]
exten => s,1,Set(SHARED(GO24_QBY,${GO24_QCALLER})=${CUT(CUT(CHANNEL(name),@,1),/,2)})
 same => n,Set(SHARED(GO24_QANS,${GO24_QCALLER})=${EPOCH})
 same => n,Return()

; звонок ответственному за клиента в CRM: ARG1 — сколько секунд звонить, ARG2 — опции Dial (g — клиент оценит разговор).
; go24 отвечает внутренним номером ответственного ("" — клиента нет в CRM или у ответственного нет номера)
[go24-owner]
exten => s,1,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(httptimeout)=3)
 same => n,Set(GO24_OWN=${CURL(${GO24_CDR:0:-3}owner,key=${URIENCODE(${GO24_KEY})}&from=${URIENCODE(${CALLERID(num)})})})
 same => n,GotoIf($["${GO24_OWN}" = "" | "${FILTER(0123456789,${GO24_OWN})}" != "${GO24_OWN}"]?none)
 same => n,Dial(Local/${GO24_OWN}@go24-ring,${ARG1},${ARG2})
 same => n,Return()
 same => n(none),Set(DIALSTATUS=)
 same => n,Return()

; звонок из REST: EXTEN — <внутренний номер сотрудника>*<кому звонить>
[go24-click]
exten => _X.,1,Set(GO24_ME=${CUT(EXTEN,*,1)})
 same => n,Set(GO24_NUM=${CUT(EXTEN,*,2)})
 same => n,GotoIf($["${GO24_ME}" = "" | "${FILTER(0123456789,${GO24_ME})}" != "${GO24_ME}" | "${GO24_NUM}" = ""]?nope)
 same => n,Set(CALLERID(all)=${GO24_NUM} <${GO24_NUM}>)
 same => n,Dial(Local/${GO24_ME}@go24-ring,45)
 same => n(nope),Hangup()

[go24-cdr]
exten => s,1,Set(CURLOPT(conntimeout)=3)
 same => n,Set(CURLOPT(httptimeout)=5)
 same => n,ExecIf($["${SHARED(GO24_QBY)}" != ""]?Set(DIALSTATUS=ANSWER))
 same => n,ExecIf($["${SHARED(GO24_QBY)}" != ""]?Set(GO24_ANSWER=${SHARED(GO24_QANS)}))
 same => n,Set(GO24_PEER=${IF($["${GO24_LINE}" != "" & "${DIALEDPEERNUMBER}" != ""]?${CUT(DIALEDPEERNUMBER,@,1)}:${GO24_BY})})
 same => n,ExecIf($["${SHARED(GO24_QBY)}" != ""]?Set(GO24_PEER=${SHARED(GO24_QBY)}))
 same => n,Set(GO24_OK=${CURL(${GO24_CDR},key=${URIENCODE(${GO24_KEY})}&id=${URIENCODE(${UNIQUEID})}&from=${URIENCODE(${GO24_FROM})}&to=${URIENCODE(${GO24_TO})}&by=${URIENCODE(${GO24_PEER})}&line=${URIENCODE(${GO24_LINE})}&start=${CDR(start,u)}&answer=${IF($["${GO24_ANSWER}" != ""]?${GO24_ANSWER}:${CDR(answer,u)})}&end=${EPOCH}&dial=${DIALSTATUS}&rec=${URIENCODE(${GO24_REC})}&vm=${GO24_VM}&xfrom=${URIENCODE(${GO24_XFROM})}&xto=${URIENCODE(${GO24_XTO})}&rate=${GO24_RATE})})
 same => n,Return()

#tryinclude go24/extensions.conf
