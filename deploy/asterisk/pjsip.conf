; boris.gb 2026-10-25 13:58 - телефония go24 (GO24DEV-501): транспорты SIP. Телефоны и софтфоны сотрудников — по UDP/TCP 5060,
; софтфон go24 в браузере — по WebSocket (http-сервер Asterisk, :8088/ws; go24 проксирует его как /telephony/ws).
; Учётки сотрудников (endpoint, auth, aor) пишет go24 в go24/pjsip.conf — руками их здесь не заводить.
[global]
type = global
user_agent = go24
endpoint_identifier_order = auth_username,username,ip

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5060

[transport-ws]
type = transport
protocol = ws
bind = 0.0.0.0

